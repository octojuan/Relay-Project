<svg viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="batonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a98d"/>
      <stop offset="100%" stop-color="#c96a4f"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c96a4f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c96a4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- jagged pulse track, same motif as the reference line -->
  <path d="M0,80 L260,80 L300,20 L340,140 L380,80 L760,80 L800,30 L840,130 L880,80 L1200,80"
        fill="none" stroke="#c96a4f" stroke-width="2" opacity="0.35"/>

  <!-- two stop points on the line -->
  <circle cx="190" cy="80" r="7" fill="#c96a4f"/>
  <circle cx="1010" cy="80" r="7" fill="#c96a4f"/>
  <circle cx="190" cy="80" r="16" fill="url(#dotGlow)"/>
  <circle cx="1010" cy="80" r="16" fill="url(#dotGlow)"/>

  <!--
    Baton travels left stop -> right stop and back, pausing 2.5s at each end.
    Total loop 11s: pause 0-2.5 (0.227), travel 2.5-5.5 (0.5), pause 5.5-8 (0.727), travel 8-11 (1.0)
  -->
  <g>
    <animateMotion
      dur="11s" repeatCount="indefinite"
      keyPoints="0;0;1;1;0"
      keyTimes="0;0.227;0.5;0.727;1"
      calcMode="linear"
      path="M190,80 L1010,80"/>
    <rect x="-22" y="-5" width="44" height="10" rx="5" fill="url(#batonGrad)"/>
    <circle cx="-22" cy="0" r="7" fill="#e8a98d"/>
    <circle cx="22" cy="0" r="7" fill="#e8a98d"/>
  </g>
</svg>
