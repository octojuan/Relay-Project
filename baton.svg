<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9fc7ea"/>
      <stop offset="100%" stop-color="#3f7cb0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4caf7d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4caf7d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- oval track -->
  <ellipse cx="450" cy="150" rx="380" ry="110" fill="none" stroke="#3f7cb0" stroke-width="2" stroke-dasharray="2 10" opacity="0.4"/>

  <!-- four green stop dots, evenly spaced -->
  <circle cx="450" cy="40" r="18" fill="url(#dotGlow)"/>
  <circle cx="450" cy="40" r="9" fill="#4caf7d"/>

  <circle cx="830" cy="150" r="18" fill="url(#dotGlow)"/>
  <circle cx="830" cy="150" r="9" fill="#4caf7d"/>

  <circle cx="450" cy="260" r="18" fill="url(#dotGlow)"/>
  <circle cx="450" cy="260" r="9" fill="#4caf7d"/>

  <circle cx="70" cy="150" r="18" fill="url(#dotGlow)"/>
  <circle cx="70" cy="150" r="9" fill="#4caf7d"/>

  <!--
    Full loop = 24s: four 2s dwells (8s) + four 4s travel legs (16s).
    keyTimes fractions of 24s:
      dwell at top:    0    -> 0.0833  (0-2s)
      travel to right: 0.0833 -> 0.25   (2-6s)
      dwell at right:  0.25 -> 0.3333  (6-8s)
      travel to bottom:0.3333 -> 0.5    (8-12s)
      dwell at bottom: 0.5 -> 0.5833   (12-14s)
      travel to left:  0.5833 -> 0.75  (14-18s)
      dwell at left:   0.75 -> 0.8333  (18-20s)
      travel to top:   0.8333 -> 1.0   (20-24s)
  -->
  <g>
    <animateMotion
      dur="24s" repeatCount="indefinite"
      keyPoints="0;    0;      0.25; 0.25;   0.5;  0.5;    0.75; 0.75;   1"
      keyTimes="0;    0.0833; 0.25; 0.3333; 0.5;  0.5833; 0.75; 0.8333; 1"
      calcMode="linear"
      path="M 450,40
            A 380,110 0 0 1 830,150
            A 380,110 0 0 1 450,260
            A 380,110 0 0 1 70,150
            A 380,110 0 0 1 450,40 Z"/>
    <circle cx="0" cy="0" r="22" fill="url(#ballGrad)"/>
  </g>
</svg>
